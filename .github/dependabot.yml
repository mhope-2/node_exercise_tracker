version: 2

updates:
  # Keep the React application and its lockfile current.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    groups:
      routine-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Keep the Node/Express backend and its separate lockfile current.
  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: daily
      time: "06:30"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    groups:
      routine-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  # Keep actions used by CI and automation current as well.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
